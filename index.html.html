/* Career Compass — editorial visual system, 2026 */
:root{--cream:#f9f8f5;--beige:#ede7db;--latte:#c8b79b;--caramel:#825a35;--cocoa:#292c2a;--line:#e5e3df;--muted:#737875;--white:#fff;--green:#326b59}

.shell{grid-template-columns:246px minmax(0,1fr)}

.pill:hover,.btn:hover{filter:none;background:#f4f3ef;border-color:#b6bcb6}

.stats{gap:12px;margin:20px 0 25px}

.stat{padding:18px 19px}

.sectionhead{margin:27px 0 14px}
.toolbar{gap:10px}

.badges{margin:17px 0;gap:6px}
.jobbottom{border-top:1px solid #eeefec;padding-top:17px;align-items:flex-end;margin-top:17px}
.salary{color:#2e4b3b;font-size:15px;font-weight:750;letter-spacing:-.01em}
.actions{gap:5px}
.actions .btn{font-size:11px;padding:7px 9px;min-height:32px}
.progress{background:#edf0e9;height:7px;border-radius:4px}
.progress>div{background:#698d73;border-radius:4px}
.skillrow{border-bottom-color:#f0f0ed}
.skillrow input{accent-color:#496c54}
.mini-grid>div{background:#f3f5f0;border-radius:5px}
.step{background:#f3f5f0;border-color:#e1e6df;border-radius:7px}
th{background:#f5f5f2;font-size:11px;font-weight:700;color:#646c64}
td{color:#454d46}
td,th{border-bottom-color:#e9ebe7}
details{background:#f7f8f5;border:1px solid #eef0ec;border-radius:5px}
.modalbg{background:#222c2688}
.modal{border-radius:9px;background:#fff;padding:30px;box-shadow:0 22px 75px #17211c44}
.footer{display:flex;justify-content:space-between;align-items:center;gap:18px;border-top:1px solid #e2e5e0;padding-top:22px;margin-top:54px;font-size:11px;color:#8c928c}
@media(max-width:1050px){.shell{grid-template-columns:74px 1fr}.sidebar{padding:19px 9px}.logo{padding:0 9px 30px}.brandname,.sidefoot,.nav .navlabel{display:none}.nav{justify-content:center}.nav span:first-child{font-size:19px}.main{padding:25px 22px 36px}}

const THEME_KEY='career-compass-appearance-v1';
const themeMedia=window.matchMedia('(prefers-color-scheme: dark)');
let themePref=localStorage.getItem(THEME_KEY)||'light';
if(!['light','dark','system'].includes(themePref))themePref='light';
function effectiveTheme(){return themePref==='system'?(themeMedia.matches?'dark':'light'):themePref}
function applyTheme(){
 const effective=effectiveTheme();
 document.documentElement.setAttribute('data-theme',effective);
 document.documentElement.style.colorScheme=effective;
 document.querySelector('meta[name="theme-color"]')?.setAttribute('content',effective==='dark'?'#171a1d':'#ead8c0');
 const quick=document.getElementById('themeQuick');
 if(quick){const isDark=effective==='dark';quick.textContent=isDark?(state.lang==='en'?'☀ Light':'☀ 淺色'):(state.lang==='en'?'☾ Dark':'☾ 深色');quick.setAttribute('aria-label',isDark?'Switch to light appearance':'Switch to dark appearance')}
}
function setTheme(mode){if(!['light','dark','system'].includes(mode))return;themePref=mode;localStorage.setItem(THEME_KEY,themePref);applyTheme();render()}
themeMedia.addEventListener?.('change',()=>{if(themePref==='system')applyTheme()});

async function loadAuthorizedFeeds(){
 if(location.protocol==='file:')return;
 try{
  const [jr,sr]=await Promise.all([fetch('data/jobs.json',{cache:'no-store'}),fetch('data/sync-status.json',{cache:'no-store'})]);
  if(!jr.ok||!sr.ok)throw Error('Feed endpoint unavailable');
  const j=await jr.json(),status=await sr.json();
  if(!j||!Array.isArray(j.jobs)||!status||typeof status!=='object')throw Error('Malformed job feed');
  const valid=j.jobs.filter(x=>x&&typeof x.title==='string'&&typeof x.company==='string'&&x.sourceType==='104').slice(0,5000);
  // Only the generated publisher output is trusted for the automated channel.
  automaticJobs=valid;
  liveSyncInfo=status;
  jobs.splice(0,jobs.length,...automaticJobs,...tracker.records,...public104Jobs);
  render();
 }catch(error){liveSyncInfo={overall:'unavailable',sources:{'104':{status:'not_configured'}},lastSuccess:null};render()}
}
